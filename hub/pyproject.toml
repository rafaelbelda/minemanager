[project]
name = "minemanager-hub"
version = "26.10.26"
description = "MineManager hub — web control plane for a Minecraft network"
requires-python = ">=3.11"
dependencies = [
    "minemanager-shared",
    "fastapi>=0.110",
    # Security floors (known CVEs below these).
    "starlette>=1.3.1",
    "h11>=0.16.0",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.scripts]
minemanager-hub = "minemanager_hub.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minemanager_hub*"]
